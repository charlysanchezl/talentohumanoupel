# UPEL SIGOA - Configuración de Proxy Inverso Nginx para Producción HTTPS
# Reemplace __DOMAIN__ por su dominio real (ej: sigoaupel.duckdns.org)
# o ejecute: sudo bash server/deploy/enable-https-aws.sh TU_DOMINIO TU_CORREO

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;
    client_max_body_size 15M;

    # Compresión Gzip para chunks Vite/Excel/PDF y respuestas JSON
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Permitir validación ACME HTTP-01 de Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Proxy inverso hacia Node/Express (PM2 en 127.0.0.1:3001)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
